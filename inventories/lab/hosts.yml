---
all:
  children:
    proxmox:
      hosts:
        proxmox-host:
          ansible_host: "{{ proxmox_api_host }}"
          ansible_user: root
          ansible_connection: ssh

    router:
      hosts:
        router.test.local:
          ansible_host: 10.20.30.1

    dns:
      hosts:
        dns.test.local:
          ansible_host: 10.20.30.250

    gitlab:
      hosts:
        gitlab.test.local:
          ansible_host: 10.20.30.100

    workstation:
      hosts:
        dev.test.local:
          ansible_host: 10.20.30.99

    k3s:
      hosts:
        k3s.test.local:
          ansible_host: 10.20.30.200

    private_subnet:
      children:
        router:
        dns:
        gitlab:
        workstation:
        k3s:
      vars:
        ansible_user: ubuntu
        ansible_ssh_private_key_file: ~/.ssh/id_rsa
