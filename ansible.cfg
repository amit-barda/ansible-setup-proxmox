[defaults]
inventory = inventories/lab/hosts.yml
roles_path = roles
host_key_checking = False
retry_files_enabled = False
stdout_callback = yaml
gathering = smart
fact_caching = jsonfile
fact_caching_connection = /tmp/ansible_facts_cache
fact_caching_timeout = 3600
# Slow SSH via ProxyJump or busy VMs may need more than default ~30s for banner exchange
timeout = 120
# Parallel SSH through one ProxyJump host often causes "No route" / dropped forwards — run one host at a time.
forks = 1

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
pipelining = True
# ControlMaster breaks or confuses many ProxyJump setups; disable multiplexing for lab SSH.
# ConnectTimeout / ServerAlive* help banner exchange and long jumps to 10.20.30.x
ssh_args = -o ControlMaster=no -o StrictHostKeyChecking=no -o ConnectTimeout=120 -o ServerAliveInterval=30 -o ServerAliveCountMax=10
