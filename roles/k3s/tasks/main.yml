---
- name: Check if K3s is installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Install K3s
  when: not k3s_binary.stat.exists
  block:
    - name: Download K3s install script
      ansible.builtin.get_url:
        url: "{{ k3s_install_url }}"
        dest: /tmp/k3s-install.sh
        mode: "0755"

    - name: Run K3s installer
      ansible.builtin.command: >
        /tmp/k3s-install.sh server
        --write-kubeconfig-mode {{ k3s_kubeconfig_mode }}
        --tls-san {{ k3s_tls_san }}
        --resolv-conf /etc/resolv.conf
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version | default(omit) }}"
      changed_when: true

- name: Wait for K3s to be ready
  ansible.builtin.command: k3s kubectl get nodes
  register: k3s_nodes
  retries: 20
  delay: 10
  until: "'Ready' in k3s_nodes.stdout"
  changed_when: false

- name: Configure K3s private registry (GitLab)
  ansible.builtin.copy:
    dest: /etc/rancher/k3s/registries.yaml
    content: |
      mirrors:
        "gitlab.test.local:5050":
          endpoint:
            - "http://gitlab.test.local:5050"
      configs:
        "gitlab.test.local:5050":
          tls:
            insecure_skip_verify: true
    owner: root
    group: root
    mode: "0644"
  notify: Restart k3s

- name: Read K3s kubeconfig
  ansible.builtin.slurp:
    src: "{{ k3s_kubeconfig_src }}"
  register: k3s_kubeconfig_raw

- name: Store kubeconfig as fact (with external URL)
  ansible.builtin.set_fact:
    k3s_kubeconfig: "{{ k3s_kubeconfig_raw.content | b64decode | regex_replace('127\\.0\\.0\\.1', 'k3s.test.local') }}"

- name: Create .kube directory on dev workstation
  ansible.builtin.file:
    path: "/home/{{ developer_username }}/.kube"
    state: directory
    owner: "{{ developer_username }}"
    group: "{{ developer_username }}"
    mode: "0700"
  delegate_to: dev.test.local

- name: Deploy kubeconfig to dev workstation
  ansible.builtin.copy:
    content: "{{ k3s_kubeconfig }}"
    dest: "/home/{{ developer_username }}/.kube/config"
    owner: "{{ developer_username }}"
    group: "{{ developer_username }}"
    mode: "0600"
  delegate_to: dev.test.local

- name: Install kubectl on dev workstation
  ansible.builtin.shell: |
    curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
    install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
    rm kubectl
  args:
    creates: /usr/local/bin/kubectl
  delegate_to: dev.test.local

- name: Verify kubectl works from dev workstation
  ansible.builtin.command: kubectl get nodes
  become: true
  become_user: "{{ developer_username }}"
  delegate_to: dev.test.local
  register: kubectl_check
  changed_when: false

- name: Display K3s node status
  ansible.builtin.debug:
    msg: "{{ kubectl_check.stdout }}"
