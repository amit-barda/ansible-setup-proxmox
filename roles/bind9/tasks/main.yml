---
- name: Install BIND9 packages
  ansible.builtin.apt:
    name: "{{ bind_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Configure BIND9 named.conf.local (includes options)
  ansible.builtin.template:
    src: named.conf.local.j2
    dest: /etc/bind/named.conf
    owner: root
    group: bind
    mode: "0644"
  notify: Restart bind9

- name: Configure forward zone file
  ansible.builtin.template:
    src: db.test.local.j2
    dest: "{{ bind_zone_file }}"
    owner: root
    group: bind
    mode: "0644"
  notify: Reload bind9

- name: Configure reverse zone file
  ansible.builtin.template:
    src: db.30.20.10.in-addr.arpa.j2
    dest: "{{ bind_reverse_zone_file }}"
    owner: root
    group: bind
    mode: "0644"
  notify: Reload bind9

- name: Validate BIND9 configuration
  ansible.builtin.command: named-checkconf /etc/bind/named.conf
  changed_when: false

- name: Validate forward zone
  ansible.builtin.command: "named-checkzone {{ bind_zone_name }} {{ bind_zone_file }}"
  changed_when: false

- name: Validate reverse zone
  ansible.builtin.command: "named-checkzone {{ bind_reverse_zone }} {{ bind_reverse_zone_file }}"
  changed_when: false

- name: Enable and start BIND9
  ansible.builtin.systemd:
    name: named
    state: started
    enabled: true
