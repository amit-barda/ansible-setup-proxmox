---
bind_packages:
  - bind9
  - bind9utils
  - bind9-dnsutils

bind_zone_name: test.local
bind_zone_file: "/etc/bind/db.{{ bind_zone_name }}"
bind_reverse_zone: "30.20.10.in-addr.arpa"
bind_reverse_zone_file: "/etc/bind/db.30.20.10.in-addr.arpa"
bind_zone_serial: 2024010101

bind_forwarders:
  - 8.8.8.8
  - 1.1.1.1
